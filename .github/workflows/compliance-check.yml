name: Compliance check

# Governance gate for viavitae-demos.
#
# Four independent checks plus an aggregate status job:
#   secrets          — TruffleHog --only-verified (licence-free)
#   licences         — npm allow-list scan + image licence manifest check
#   governance       — CODEOWNERS, .editorconfig, .gitignore presence
#   action-pinning   — every `uses:` must be a 40-character commit SHA (rule R4)
#
# LEAST-PRIVILEGE TOKEN
#   The workflow default is `contents: read`. Only the `licences` job escalates
#   to `pull-requests: write` for the manual-review label.

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "compliance-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
  ALLOWED_LICENCES: "MIT Apache-2.0 BSD-2-Clause BSD-3-Clause 0BSD ISC CC0-1.0 Unlicense Proprietary"
  FORBIDDEN_LICENCES: "GPL-2.0 GPL-3.0 AGPL-3.0 LGPL-2.1 LGPL-3.0 MPL-2.0 EPL-1.0 EPL-2.0 CDDL-1.0 SSPL-1.0 BUSL-1.1"
  REVIEW_LABEL: "compliance/licence-review"

jobs:
  # ---------------------------------------------------------------------------
  # secrets — TruffleHog (licence-free, replaces Gitleaks which requires paid key)
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog (full history, verified only)
        uses: trufflesecurity/trufflehog@main
        with:
          args: "--only-verified"

      - name: Confirm the scan ran
        if: failure()
        run: |
          echo "::error::TruffleHog reported a verified finding. Rotate the credential immediately, then purge history."
          echo "Rotating is the priority — purging history does not un-leak a live secret."
          exit 1

  # ---------------------------------------------------------------------------
  # licences — npm allow-list enforcement
  # ---------------------------------------------------------------------------
  licences:
    name: Licence compliance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Node licence report
        run: |
          set -uo pipefail
          npx --yes license-checker-rseidelsohn --production --json > node-licences.json
          node - <<'JS'
          const fs = require("fs");
          const allowed = new Set(process.env.ALLOWED_LICENCES.split(/\s+/));
          const forbidden = new Set(process.env.FORBIDDEN_LICENCES.split(/\s+/));
          const report = JSON.parse(fs.readFileSync("node-licences.json", "utf8"));
          const bad = [];
          const review = [];
          for (const [pkg, meta] of Object.entries(report)) {
            const lic = String(meta.licenses || "").trim();
            if (!lic || /unknown|custom|see licen/i.test(lic)) {
              review.push(`${pkg}: licence not declared ('${lic || "none"}')`);
              continue;
            }
            const tokens = lic.split(/[\s,/()]+| OR | AND /).filter(Boolean);
            if (tokens.some((t) => forbidden.has(t))) {
              bad.push(`${pkg}: FORBIDDEN licence '${lic}'`);
            } else if (!tokens.some((t) => allowed.has(t))) {
              review.push(`${pkg}: unrecognised licence '${lic}'`);
            }
          }
          console.log(`scanned ${Object.keys(report).length} Node packages`);
          for (const line of bad) console.log(`::error::${line}`);
          for (const line of review) console.log(`::warning::${line}`);
          fs.writeFileSync("licence-review.txt", review.map((l) => `node: ${l}\n`).join(""));
          fs.writeFileSync("licence-failures.txt", bad.map((l) => `node: ${l}\n`).join(""));
          if (bad.length) {
            console.log("::error::Forbidden licences present. Remove the dependency or record a legal decision as an ADR.");
            process.exit(1);
          }
          JS

      - name: Report packages needing manual review
        if: always()
        run: |
          set -uo pipefail
          if [ -s licence-review.txt ]; then
            count=$(wc -l < licence-review.txt)
            echo "::warning title=Licence review required::${count} package(s) have an unknown or undeclared licence."
            cat licence-review.txt
          else
            echo "No packages require manual licence review."
          fi

      - name: Apply manual review label
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ -s licence-review.txt ]; then
            gh pr edit "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --add-label "${REVIEW_LABEL}" \
              || echo "::warning::Could not apply '${REVIEW_LABEL}'."
          else
            gh pr edit "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}" \
              --remove-label "${REVIEW_LABEL}" \
              || true
          fi

      - name: Upload licence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licence-reports
          path: |
            node-licences.json
            licence-review.txt
            licence-failures.txt
          if-no-files-found: ignore
          retention-days: 90

      - name: Fail on unknown licences
        run: |
          set -uo pipefail
          if [ -s licence-review.txt ]; then
            echo "::error::Unknown licences present. Unknown is treated as failure until legal confirms."
            exit 1
          fi
          echo "All resolved licences are on the allow list."

  # ---------------------------------------------------------------------------
  # governance — required files present and valid
  # ---------------------------------------------------------------------------
  governance:
    name: Governance files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required governance files
        run: |
          set -uo pipefail
          missing=0
          for f in README.md LICENSE SECURITY.md CONTRIBUTING.md CHANGELOG.md \
                   QODER.md .gitignore .editorconfig .npmrc \
                   .github/CODEOWNERS .github/dependabot.yml \
                   .github/PULL_REQUEST_TEMPLATE.md \
                   docs/architecture.md docs/DPIA-template.md; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required governance file: $f"
              missing=1
            elif [ ! -s "$f" ]; then
              echo "::error::Required governance file is empty: $f"
              missing=1
            else
              echo "present: $f"
            fi
          done
          exit "$missing"

      - name: Verify CODEOWNERS is not empty and has a default owner
        run: |
          set -uo pipefail
          file=.github/CODEOWNERS
          effective=$(grep -vE '^\s*(#|$)' "$file" || true)
          if [ -z "$effective" ]; then
            echo "::error::CODEOWNERS contains no effective rules."
            exit 1
          fi
          if ! printf '%s\n' "$effective" | grep -qE '^\*\s+@'; then
            echo "::error::CODEOWNERS has no '* @owner' default rule."
            exit 1
          fi
          if printf '%s\n' "$effective" | grep -qE '@org/|<OWNER_HANDLE>|@your-org|viavitae-org'; then
            echo "::error::CODEOWNERS still contains template placeholders."
            exit 1
          fi
          echo "effective CODEOWNERS rules: $(printf '%s\n' "$effective" | wc -l)"

      - name: Verify .editorconfig declares root
        run: |
          set -uo pipefail
          if ! grep -qE '^root\s*=\s*true' .editorconfig; then
            echo "::error::.editorconfig must declare 'root = true'."
            exit 1
          fi
          for key in charset end_of_line insert_final_newline trim_trailing_whitespace; do
            grep -qE "^\s*${key}\s*=" .editorconfig || {
              echo "::error::.editorconfig is missing the '${key}' setting."
              exit 1
            }
          done
          echo ".editorconfig declares root and all required base settings"

      - name: Verify .gitignore covers secrets and state
        run: |
          set -uo pipefail
          required=('\.env' '\.venv/?' 'node_modules/?' '\*\.pem' '\*\.key' 'secrets/?' '\*\.tfstate')
          failed=0
          for pattern in "${required[@]}"; do
            if ! grep -qE "^!?${pattern}" .gitignore; then
              echo "::error::.gitignore does not cover '${pattern}'."
              failed=1
            fi
          done
          exit "$failed"

  # ---------------------------------------------------------------------------
  # action-pinning — rule R4 enforcement
  # ---------------------------------------------------------------------------
  action-pinning:
    name: Action SHA pinning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify every action reference is SHA-pinned
        run: |
          set -uo pipefail
          unpinned=0
          total=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            total=$((total + 1))
            file=${line%%:*}
            rest=${line#*:}
            lineno=${rest%%:*}
            ref=$(printf '%s' "$rest" | sed -E 's/.*uses:[[:space:]]*//; s/[[:space:]]*$//')
            case "$ref" in
              ./*|./.github/*) continue ;;
            esac
            # Strip trailing comment (tag label)
            ref=$(printf '%s' "$ref" | sed -E 's/[[:space:]]*#.*$//')
            if ! printf '%s' "$ref" | grep -qE '@[0-9a-f]{40}$'; then
              echo "::error file=${file},line=${lineno}::Unpinned action '${ref}'. Rule R4 requires a full-length commit SHA."
              unpinned=$((unpinned + 1))
            fi
          done < <(grep -rn --include='*.yml' --include='*.yaml' -E '^\s*uses:\s*\S+' .github/workflows .github/actions 2>/dev/null | grep -v '^\s*#')

          echo "action references checked: ${total}; unpinned: ${unpinned}"
          if [ "${unpinned}" -ne 0 ]; then
            echo "::error::${unpinned} action reference(s) are not SHA-pinned."
            exit 1
          fi

      - name: Verify least-privilege permissions
        run: |
          set -uo pipefail
          failed=0
          for f in .github/workflows/*.yml; do
            if ! grep -qE '^permissions:' "$f"; then
              echo "::error file=${f}::Workflow has no top-level 'permissions' block."
              failed=1
            fi
            if grep -qE '^\s*permissions:\s*(write-all|read-all)\s*$' "$f"; then
              echo "::error file=${f}::Workflow uses 'permissions: write-all'."
              failed=1
            fi
          done
          exit "${failed}"

  # ---------------------------------------------------------------------------
  # compliance-status — single required check for branch protection
  # ---------------------------------------------------------------------------
  compliance-status:
    name: Compliance status
    needs: [secrets, licences, governance, action-pinning]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Evaluate compliance gates
        run: |
          set -uo pipefail
          results='${{ toJSON(needs) }}'
          printf '%s\n' "$results" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          failed=$(printf '%s\n' "$results" | jq '[to_entries[] | select(.value.result != "success" and .value.result != "skipped")] | length')
          if [ "$failed" -ne 0 ]; then
            echo "::error::${failed} compliance gate(s) did not succeed."
            exit 1
          fi
          echo "All compliance gates passed."
