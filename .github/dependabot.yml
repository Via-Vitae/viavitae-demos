# Dependabot configuration — viavitae-demos
#
# Weekly, grouped dependency updates for the Node/pnpm monorepo.
# Security updates are configured separately in repository settings and must
# remain enabled.

version: 2

updates:

  # --- Node (npm/pnpm) -------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vilnius"
    open-pull-requests-limit: 10
    reviewers:
      - "JourneyOfLife"
      - "IterVitae"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major bumps are a deliberate decision, not an automated one.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Framework majors are a migration project, scheduled separately.
      - dependency-name: "next"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"

  # --- GitHub Actions ---------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vilnius"
    open-pull-requests-limit: 10
    reviewers:
      - "JourneyOfLife"
      - "IterVitae"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Actions are pinned to full-length commit SHAs under rule R4. Dependabot
      # moves the SHA and reports the resolved tag; never relax a pin back to
      # a mutable tag or branch reference.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # --- Docker -----------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vilnius"
    open-pull-requests-limit: 10
    reviewers:
      - "JourneyOfLife"
      - "IterVitae"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      base-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Base image majors are a runtime upgrade decision, coordinated with the
      # test matrix in ci.yml.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
